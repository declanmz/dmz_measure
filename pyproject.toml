[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# dmz_measure includes a copy of measureme (https://github.com/sharpelab/measureme, commit
# 2fab7a4, GPL-3.0) as dmz_measure.measureme. It does not use or replace an installed
# measureme (`sweep`): both can be installed side by side.
[project]
name = "dmz_measure"
version = "0.6.0"
description = "measureme + SR860 streaming, noise surveys and streamed gate sweeps"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5", "tqdm", "ipython"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dmz_measure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
